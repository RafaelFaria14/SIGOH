
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Acesso ao SIGOH - Sistema de Gestão Ortopédica Hospitalar"
    >
        <link rel="stylesheet" href="../css/main.css">
        <link rel="stylesheet" href="../css/paginas.css/login.css">
    >

    <title>Login | SIGOH</title>
</head>

<body class="login-page">

    <main class="login">

        <section class="login__container">

            <header class="login__header">
                <h1 class="login__logo">SIGOH</h1>

                <p class="login__subtitle">
                    Sistema de Gestão Ortopédica Hospitalar
                </p>
            </header>

            <section class="login__content">

                <h2 class="login__title">Bem-vindo de volta</h2>

                <p class="login__description">
                    Entre com suas credenciais para acessar o sistema.
                </p>

                <form class="login__form" action="#" method="get">

                    <div class="form-group">
                        <label for="email">E-mail</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seuemail@exemplo.com"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button class="login__button" type="submit">
                        Entrar no sistema
                    </button>

                </form>

            </section>

            <footer class="login__footer">
                <p>
                    SIGOH &copy; 2026
                </p>

                <p>
                    Sistema acadêmico demonstrativo
                </p>
            </footer>

        </section>

    </main>

</body>

</html>
