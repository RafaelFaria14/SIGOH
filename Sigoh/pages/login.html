<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login - SIGOH Sistema de Gestão Ortopédica Hospitalar">
    <title>Login | SIGOH</title>
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

    <main class="login-container">
        <section class="card-login">
            <header class="sigoh-header">
                <h1 class="sigoh-titulo">SIGOH</h1>
                <p class="sigoh-subtitulo">Sistema de Gestão Ortopédica Hospitalar</p>
            </header>

            <div class="login-boas-vindas">
                <h2>Bem-vindo de volta</h2>
                <p>Entre com suas credenciais para acessar o sistema.</p>
            </div>

            <form class="login-form">
                <div class="form-grupo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="form-grupo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn-acessar">Entrar no sistema</button>
            </form>

            <a href="../index.html" class="btn-voltar">
                &larr; Voltar para a página inicial
            </a>

            <footer class="card-footer">
                <p>SIGOH &copy; 2026</p>
                <small>Sistema acadêmico demonstrativo</small>
            </footer>
        </section>
    </main>

</body>

</html>
